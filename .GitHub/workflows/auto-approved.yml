      - name: Remove old module versions
        run: |
          cd modules
          
          # This will find all .mp files
          for file in *.mp; do
            # Extract the module name and version. 
            # This regex splits 'my_module_v1.0.0.mp' into 'my_module' and '1.0.0'
            base_name=$(echo $file | sed -E 's/(.*)_[vV]?[0-9]+\.[0-9]+.*\.mp/\1/')
            
            # Now we find all files that start with the base_name
            # and sort them using 'sort -V' (version sort)
            # This handles 1.10.0 being newer than 1.9.0 automatically
            
            files_to_check=$(ls ${base_name}_* 2>/dev/null)
            
            if [ "$(echo "$files_to_check" | wc -l)" -gt 1 ]; then
              echo "Cleaning up $base_name versions..."
              
              # 'sort -V' is the key here. It treats version numbers mathematically
              # rather than alphabetically.
              sorted_files=$(echo "$files_to_check" | sort -V)
              
              # Keep the last line (newest), delete the rest
              files_to_delete=$(echo "$sorted_files" | head -n -1)
              
              echo "$files_to_delete" | xargs rm -f
            fi
          done
